<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindfulAI Journal</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400&family=Homemade+Apple&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css">
    <style>
      /* Add all the CSS styles here */
      .notebook {
        perspective: 1000px;
        transform-style: preserve-3d;
        transition: transform 1s ease;
      }

      .notebook-pages {
        position: relative;
        transform-origin: left;
        animation: openBook 1.5s ease forwards;
        background: linear-gradient(to right, #f1f1f1 0%, #fff 100%);
        box-shadow: 5px 5px 20px rgba(0, 0, 0, 0.2),
          inset -10px 0 20px rgba(0, 0, 0, 0.05);
      }

      @keyframes openBook {
        0% {
          transform: rotateY(90deg);
        }
        100% {
          transform: rotateY(0deg);
        }
      }

      .page-lines {
        background-image: linear-gradient(#e1e1e1 1px, transparent 1px),
          linear-gradient(90deg, #f3a5a5 1px, transparent 1px);
        background-size: 100% 1.5rem, 3rem 100%;
        background-position: 0 -1px;
        border-left: 2px solid #ff9999;
        margin-left: 3rem;
      }

      .margin-line {
        position: absolute;
        left: 2.5rem;
        top: 0;
        bottom: 0;
        width: 1px;
        background-color: #ff9999;
      }

      .page-binding {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3rem;
        background: linear-gradient(to right, #d4d4d4, #e5e5e5);
        border-right: 1px solid #ccc;
        box-shadow: inset -2px 0 5px rgba(0, 0, 0, 0.1),
          2px 0 5px rgba(0, 0, 0, 0.05);
      }

      .binding-rings {
        position: absolute;
        left: 0.5rem;
        width: 0.5rem;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-around;
      }

      .ring {
        width: 1.5rem;
        height: 1.5rem;
        background: linear-gradient(145deg, #8e8e8e, #696969);
        border-radius: 50%;
        box-shadow: inset 2px 2px 5px rgba(255, 255, 255, 0.3),
          inset -2px -2px 5px rgba(0, 0, 0, 0.3);
      }

      .journal-content {
        font-family: "Kalam", cursive;
        font-size: 1.2rem;
        line-height: 1.5rem;
        color: #2d3748;
        background: transparent;
        resize: none;
        border: none;
        width: 100%;
        height: 100%;
        padding: 1.5rem 2rem;
        outline: none;
      }

      .date-field {
        font-family: "Homemade Apple", cursive;
        font-size: 1rem;
        color: #4a5568;
        border: none;
        background: transparent;
        padding: 0.5rem;
        outline: none;
        width: 200px;
      }

      .save-button {
        font-family: "Kalam", cursive;
        background-color: #4f46e5;
        color: white;
        border: none;
        padding: 0.5rem 1.5rem;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
      }

      .save-button:hover {
        background-color: #4338ca;
        transform: translateY(-2px);
        box-shadow: 2px 4px 12px rgba(0, 0, 0, 0.15);
      }

      .coffee-stain {
        position: absolute;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: rgba(240, 9, 9, 0.1);
        pointer-events: none;
      }

      .coffee-stain:nth-child(1) {
        top: 20px;
        right: 40px;
        transform: scale(1.2);
      }

      .coffee-stain:nth-child(2) {
        bottom: 60px;
        left: 120px;
        transform: scale(0.8) rotate(45deg);
      }

      .saved-journals-box {
        position: fixed;
        top: 100px;
        right: 20px;
        width: 300px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        padding: 16px;
        max-height: 400px;
        overflow-y: auto;
      }

      .saved-journals-box h3 {
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 12px;
        color: #2d3748;
      }

      .saved-journal-item {
        padding: 8px;
        border-bottom: 1px solid #e2e8f0;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .saved-journal-item:hover {
        background: #f7fafc;
      }

      .saved-journal-item:last-child {
        border-bottom: none;
      }

      .saved-journal-item h4 {
        font-size: 1rem;
        font-weight: 500;
        color: #4a5568;
      }

      .saved-journal-item p {
        font-size: 0.875rem;
        color: #718096;
        margin-top: 4px;
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-white shadow-sm">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
          <div class="flex items-center gap-2">
            <div
              class="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center"
            >
              <i class="fas fa-brain text-indigo-600 text-xl"></i>
            </div>
            <span class="text-xl font-semibold text-gray-800">MindfulAI</span>
          </div>
          <div class="flex items-center gap-4">
            <button class="text-gray-600 hover:text-gray-800">
              <i class="fas fa-cog text-xl"></i>
            </button>
            <a href="/chat">AI Bot</a>
            <a href="/profile">Profile</a>
            <div
              id="user-initials"
              class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center text-white font-semibold"
            >
              JS
            </div>
          </div>
        </div>
      </div>
    </nav>
    <div class="max-w-5xl mx-auto px-4 mt-5">
      <!-- Header -->
      <div class="flex items-center justify-between mb-8">
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center"
          >
            <i class="fas fa-book text-indigo-600 text-xl"></i>
          </div>
          <h1 id="journal-title" class="text-2xl font-semibold text-gray-800">
            My Journal
          </h1>
        </div>
        <button class="save-button" id="save-button">
          <i class="fas fa-save mr-2"></i>Save Entry
        </button>
      </div>

      <!-- Notebook -->
      <div class="notebook">
        <div class="notebook-pages rounded-lg min-h-[800px] relative bg-white">
          <!-- Decorative coffee stains -->
          <div class="coffee-stain"></div>
          <div class="coffee-stain"></div>

          <!-- Binding decoration -->
          <div class="page-binding">
            <div class="binding-rings">
              <div class="ring"></div>
              <div class="ring"></div>
              <div class="ring"></div>
              <div class="ring"></div>
              <div class="ring"></div>
            </div>
          </div>

          <!-- Main content area -->
          <div class="page-lines h-full">
            <div class="margin-line"></div>

            <!-- Date field -->
            <input
              id="journal-date"
              type="text"
              class="date-field ml-8 mt-4"
              value=""
              readonly
            />

            <!-- Journal content -->
            <textarea
              id="journal-content"
              class="journal-content"
              placeholder="Dear Diary..."
            ></textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- Saved Journals Box -->
    <div class="saved-journals-box">
      <h3>Saved Journals</h3>
      <div id="saved-journals-list"></div>
    </div>

    <script>
      // Simulated data object
      const journalData = {
        user: {
          name: "sasmita",
          initials: "SD",
          status: "Member",
        },
        journal: {
          title: "My Journal",
          date: "monday, feb 8, 2025",
          content: "Today was a great day! I learned a lot about mindfulness.",
        },
      };

      // Function to update the UI with dynamic data
      function updateJournalUI(data) {
        // Update user profile
        document.getElementById("user-initials").textContent =
          data.user.initials;

        // Update journal title
        document.getElementById("journal-title").textContent =
          data.journal.title;

        // Update journal date
        document.getElementById("journal-date").value = data.journal.date;

        // Update journal content
        document.getElementById("journal-content").value = data.journal.content;
      }

      // Function to save journal entry to local storage
      function saveJournalEntry() {
        const title = document.getElementById("journal-title").textContent;
        const date = document.getElementById("journal-date").value;
        const content = document.getElementById("journal-content").value;

        const entry = { title, date, content };

        // Get existing entries from local storage
        const savedEntries = JSON.parse(localStorage.getItem("journals")) || [];

        // Add new entry
        savedEntries.push(entry);

        // Save back to local storage
        localStorage.setItem("journals", JSON.stringify(savedEntries));

        // Refresh saved journals list
        displaySavedJournals();
      }

      // Function to display saved journals
      function displaySavedJournals() {
        const savedEntries = JSON.parse(localStorage.getItem("journals")) || [];
        const savedJournalsList = document.getElementById("saved-journals-list");

        // Clear existing list
        savedJournalsList.innerHTML = "";

        // Add each entry to the list
        savedEntries.forEach((entry, index) => {
          const journalItem = document.createElement("div");
          journalItem.className = "saved-journal-item";
          journalItem.innerHTML = `
            <h4>${entry.title}</h4>
            <p>${entry.date}</p>
          `;
          journalItem.addEventListener("click", () => loadJournalEntry(index));
          savedJournalsList.appendChild(journalItem);
        });
      }

      // Function to load a saved journal entry
      function loadJournalEntry(index) {
        const savedEntries = JSON.parse(localStorage.getItem("journals")) || [];
        const entry = savedEntries[index];

        // Update the UI with the selected entry
        document.getElementById("journal-title").textContent = entry.title;
        document.getElementById("journal-date").value = entry.date;
        document.getElementById("journal-content").value = entry.content;
      }

      // Save button event listener
      document
        .getElementById("save-button")
        .addEventListener("click", function () {
          saveJournalEntry();

          // Add save animation
          this.innerHTML = '<i class="fas fa-check mr-2"></i>Saved!';
          this.style.backgroundColor = "#059669";

          setTimeout(() => {
            this.innerHTML = '<i class="fas fa-save mr-2"></i>Save Entry';
            this.style.backgroundColor = "#4F46E5";
          }, 2000);
        });

      // Auto-resize textarea
      const textarea = document.querySelector(".journal-content");
      textarea.addEventListener("input", function () {
        this.style.height = "auto";
        this.style.height = this.scrollHeight + "px";
      });

      // Initialize the journal
      updateJournalUI(journalData);
      displaySavedJournals();
    </script>
  </body>
</html>
