<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Wellness Chat</title>
		<link
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/css" />
		<style>
			/* Your existing styles... */
		</style>
	</head>
	<body class="bg-gray-50 h-screen flex">
		<!-- Sidebar -->
		<div class="w-80 bg-white border-r flex flex-col">
			<!-- Sidebar Header -->
			<div class="p-4 border-b">
				<div class="flex items-center gap-3">
					<div
						class="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center"
					>
						<i class="fas fa-brain text-indigo-600 text-xl"></i>
					</div>
					<span class="text-xl font-semibold text-gray-800"
						>MindfulAI</span
					>
				</div>
			</div>

			<!-- New Chat Button -->
			<div class="p-4">
				<button
					onclick="startNewChat()"
					class="w-full bg-indigo-600 text-white px-4 py-2 rounded-xl hover:bg-indigo-700 transition-colors duration-200 flex items-center justify-center gap-2"
				>
					<i class="fas fa-plus"></i>
					<span>New Chat</span>
				</button>
			</div>

			<!-- Chat History Tabs -->
			<div class="flex-1 overflow-y-auto custom-scrollbar">
				<div class="p-2 text-sm text-gray-500 font-medium">
					Recent Chats
				</div>
				<div id="chat-tabs" class="space-y-1"></div>
			</div>

			<!-- User Profile Section -->
			<div class="p-4 border-t">
				<div class="flex items-center gap-3">
					<div
						class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center text-white font-semibold"
						id="user-initials"
					>
						JS
					</div>
					<div class="flex-1 min-w-0">
						<div
							class="text-sm font-medium text-gray-900"
							id="user-name"
						>
							John Smith
						</div>
						<div class="text-xs text-gray-500" id="user-status">
							Premium Member
						</div>
					</div>
					<button class="text-gray-400 hover:text-gray-600">
						<i class="fas fa-cog"></i>
					</button>
				</div>
			</div>
		</div>

		<!-- Main Chat Area -->
		<div class="flex-1 flex flex-col">
			<div class="container mx-auto p-4 flex-1 flex flex-col max-w-4xl">
				<!-- Chat Header -->
				<div class="bg-white rounded-t-xl shadow-sm p-4 border-b">
					<div class="flex items-center justify-between">
						<div class="flex items-center gap-3">
							<div
								class="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center"
							>
								<i
									class="fas fa-comments text-indigo-600 text-xl"
								></i>
							</div>
							<div>
								<h1
									class="text-xl font-semibold text-gray-800"
									id="chat-title"
								>
									Current Session
								</h1>
								<p class="text-sm text-gray-500">
									Here to support you 24/7
								</p>
							</div>
						</div>
						<div class="flex gap-2">
							<button
								class="p-2 text-gray-400 hover:text-gray-600"
							>
								<i class="fas fa-search"></i>
							</button>
							<button
								class="p-2 text-gray-400 hover:text-gray-600"
							>
								<i class="fas fa-ellipsis-v"></i>
							</button>
						</div>
					</div>
				</div>

				<!-- Chat Messages Container -->
				<div
					id="chat-container"
					class="flex-1 bg-white overflow-y-auto custom-scrollbar p-4"
				>
					<div id="messages" class="space-y-4"></div>
				</div>

				<!-- Input Area -->
				<div class="bg-white rounded-b-xl shadow-sm p-4 border-t">
					<form id="chat-form" class="flex gap-2">
						<div class="flex-1 relative">
							<textarea
								id="message-input"
								class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400 resize-none transition-all duration-200"
								placeholder="Type your message here..."
								rows="1"
								style="min-height: 44px; max-height: 150px"
							></textarea>
						</div>
						<button
							type="submit"
							class="bg-indigo-600 text-white rounded-xl px-6 py-2 hover:bg-indigo-700 focus:ring-2 focus:ring-indigo-200 transition-colors duration-200 flex items-center gap-2"
						>
							<span>Send</span>
							<i class="fas fa-paper-plane"></i>
						</button>
					</form>
				</div>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
		<script>
			const messageInput = document.getElementById("message-input");
			const chatForm = document.getElementById("chat-form");
			const messagesContainer = document.getElementById("messages");
			const chatTabsContainer = document.getElementById("chat-tabs");
			const chatTitle = document.getElementById("chat-title");

			// Fetch chats from the backend on page load
			async function fetchChats() {
				try {
					const response = await axios.get("/api/chats"); // Update this URL based on your backend API
					const chats = response.data;
					chatData.chats = chats; // Update chat data

					renderChatTabs();
					switchChat(chats[0].id); // Start with the first chat
				} catch (error) {
					console.error("Error fetching chats:", error);
				}
			}

			// Function to render chat tabs
			function renderChatTabs() {
				chatTabsContainer.innerHTML = "";
				chatData.chats.forEach((chat) => {
					const tab = document.createElement("div");
					tab.className = `chat-tab p-3 hover:bg-gray-50 cursor-pointer flex items-center gap-3 ${
						chat.id === currentChat.id ? "active" : ""
					}`;
					tab.innerHTML = `
				<div class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center">
				  <i class="fas fa-comment text-indigo-600"></i>
				</div>
				<div class="flex-1 min-w-0">
				  <div class="text-sm font-medium text-gray-900 truncate">${chat.title}</div>
				  <div class="text-xs text-gray-500">${chat.messages.length} messages</div>
				</div>
			  `;
					tab.addEventListener("click", () => switchChat(chat.id));
					chatTabsContainer.appendChild(tab);
				});
			}

			// Function to create a new chat and send it to the backend
			async function startNewChat() {
				try {
					const response = await axios.post("/api/chats", {
						title: "New Chat",
					});
					const newChat = response.data;
					chatData.chats.push(newChat);
					switchChat(newChat.id);
				} catch (error) {
					console.error("Error starting new chat:", error);
				}
			}

			// Function to send a new message to the backend
			async function sendMessage(message) {
				try {
					await axios.post(`/api/chats/${currentChat.id}/messages`, {
						message,
						sender: "user",
					});
					addMessage(message, "user");
				} catch (error) {
					console.error("Error sending message:", error);
				}
			}

			// Function to handle form submission (sending message)
			chatForm.addEventListener("submit", function (e) {
				e.preventDefault();
				const message = messageInput.value.trim();
				if (!message) return;

				sendMessage(message);
				messageInput.value = "";
				messageInput.style.height = "auto";
			});

			// Initialize the chat
			fetchChats(); // Fetch the chats from the backend when the page loads
		</script>
	</body>
</html>
